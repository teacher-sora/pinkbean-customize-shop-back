# main 브랜치에 올리면(= dev 를 병합하면) 운영 서버(Fly 앱 pinkbean-customize-shop-back)에 배포한다.
# 운영 사이트(pinkbean-customize.com)가 이 서버를 쓴다. 병합이 곧 운영 배포이므로, 병합은 지시가 있을 때만 하고
# 검색을 고쳤으면 병합 전에 build/snapshot.py 가 "통과"여야 한다(ARCHITECTURE 7 · 8).
# 키: 저장소 비밀값 FLY_API_TOKEN(운영 앱만 배포할 수 있는 토큰. `fly tokens create deploy -a <운영 앱>`).
name: 운영 서버 배포

on:
  push:
    branches: [main]
    paths: ['app.py', 'data/**', 'requirements.txt', 'Dockerfile', 'fly.toml', '.github/workflows/deploy-main.yml']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false   # 진행 중인 운영 배포를 끊지 않는다. 다음 것은 기다렸다가 돈다

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app pinkbean-customize-shop-back
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: 확인
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://pinkbean-customize-shop-back.fly.dev/health && exit 0
            sleep 10
          done
          exit 1
